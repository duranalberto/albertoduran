<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="256" height="256">
  <defs>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e23241" />
      <stop offset="100%" stop-color="#CC0810" />
    </linearGradient>

    <linearGradient id="white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0" />
      <stop offset="100%" stop-color="#b8b8b8" />
    </linearGradient>
    
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#drop-shadow)" font-family="sans-serif" font-weight="900" font-size="420">
    <text x="175" y="405" text-anchor="middle" fill="url(#red)">A</text>
    <text x="357" y="405" text-anchor="middle" fill="url(#white)">D</text>
  </g>
</svg>
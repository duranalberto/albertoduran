<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" style="background:transparent">
  <defs>
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e23241" />
      <stop offset="100%" stop-color="#CC0810" />
    </linearGradient>

    <linearGradient id="grad-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0" />
      <stop offset="100%" stop-color="#b8b8b8" />
    </linearGradient>
    
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#drop-shadow)" font-family="sans-serif" font-weight="900" font-size="420">
    <text x="175" y="405" text-anchor="middle" fill="url(#grad-red)">A</text>
    <text x="357" y="405" text-anchor="middle" fill="url(#grad-white)">D</text>
  </g>
</svg>